name: Android CI

on:
  push:
    branches:
      - master
      - 'work/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Android app and test Bramble core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # Avoid android-actions/setup-android@v3 here: it tries to install
      # the obsolete SDK package named 'tools' and fails before Gradle runs.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug variant and run Bramble core tests
        run: ./gradlew :briar-android:assembleDebug :bramble-core:test --no-daemon --stacktrace
